     cy="430"
     r="190"
     fill="#c23b3b"
     fill-opacity="0.18"
     stroke="#c23b3b"
     stroke-width="3"
     id="circle3"
     style="stroke:none" />
  <!-- domain titles and questions -->
  <g
     text-anchor="middle"
     fill="#1a1a1a"
     id="g10">
    <text
       x="215"
       y="150"
       font-size="26"
       font-weight="bold"
       id="text3">Research</text>
    <text
       x="215"
       y="180"
       font-size="26"
       font-weight="bold"
       id="text4">integrity</text>
    <text
       x="215"
       y="208"
       font-size="16"
       font-style="italic"
       id="text5">Can I trust the result?</text>
    <text
       x="585"
       y="150"
       font-size="26"
       font-weight="bold"
       id="text6">Confidentiality</text>
    <text
       x="585"
       y="178"
       font-size="16"
       font-style="italic"
       id="text7">What information</text>
    <text
       x="585"
       y="198"
       font-size="16"
       font-style="italic"
       id="text8">am I exposing?</text>
    <text
       x="400"
       y="545"
       font-size="26"
       font-weight="bold"
       id="text9">Cybersecurity</text>
    <text
       x="400"
       y="572"
       font-size="16"
       font-style="italic"
       id="text10">What can the tool do?</text>
  </g>
  <!-- overlap examples -->
  <g
     text-anchor="middle"
     fill="#1a1a1a"
     font-size="14"
     id="g20">
    <text
       x="400"
       y="150"
       id="text11">collaborator's</text>
    <text
       x="400"
       y="168"
       id="text12">unpublished work</text>
    <text
       x="400"
       y="186"
       id="text13">given to a chatbot</text>
    <text
